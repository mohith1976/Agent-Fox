services:
  postgres:
    image: postgres:17
    container_name: agent-fox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - agent_fox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: agent-fox-localstack
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      # All values read from .env — bare references, no fallback literals
      AWS_DEFAULT_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_WORKBOOK_KEY: ${AWS_S3_WORKBOOK_KEY}
      DEBUG: 0
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      # ✅ Durability: persist S3 state to disk so buckets/objects survive
      # container restarts (requires Pro token, which we pass above).
      # The data volume below then actually preserves state across restarts.
      PERSISTENCE: 1
    volumes:
      - agent_fox_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal s3 ls > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis/redis-stack:latest
    container_name: agent-fox-redis
    restart: unless-stopped
    ports:
      - '6380:6379'      # ✅ External port 6380 to avoid conflict with company Redis on 6379
      - '8002:8001'      # ✅ RedisInsight on 8002
    environment:
      REDIS_ARGS: "--save 60 1 --loglevel warning"
    volumes:
      - agent_fox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: agent-fox-api
    restart: unless-stopped
    ports:
      - '${PORT}:3009'
    # Secrets (.env) are injected at runtime, never baked into the image
    # (see .dockerignore). Credentials/names below are bare ${VAR} references
    # — no fallback literals, so a missing env fails loudly instead of
    # silently running on someone's hardcoded value. Only the
    # container-network topology (service names/ports, defined by this file
    # itself) is literal — one variable cannot mean "localhost" for host runs
    # and "redis" for containers at the same time.
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_S3_ENDPOINT: http://localstack:4566
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      # Hot-reload: host source overlays the baked copy; anonymous volumes
      # keep container node_modules (Linux-built) intact.
      - ./apps/api/src:/app/apps/api/src
      - /app/node_modules
      - /app/apps/api/node_modules

volumes:
  agent_fox_postgres_data:
  agent_fox_localstack_data:
  agent_fox_redis_data: